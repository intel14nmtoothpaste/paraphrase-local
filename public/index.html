<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paraphrase-local</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>paraphrase-local</h1>
      <nav>
        <a href="/" aria-current="page">Editor</a>
        <a href="/history">History</a>
      </nav>
    </header>

    <main class="layout">
      <section class="pane">
        <label for="input">Input</label>
        <textarea id="input" placeholder="Paste text here…"></textarea>
      </section>
      <section class="pane">
        <label for="output">Output</label>
        <div id="output" class="output" role="textbox" aria-readonly="true"></div>
      </section>
    </main>

    <div class="toolbar">
      <div class="modes" role="group" aria-label="Mode">
        <button type="button" class="mode" data-mode="paraphrase" aria-pressed="true">Paraphrase</button>
        <button type="button" class="mode" data-mode="summarize" aria-pressed="false">Summarize</button>
        <button type="button" class="mode" data-mode="grammar" aria-pressed="false">Fix grammar</button>
      </div>
      <label class="tone">
        Tone
        <select id="tone">
          <option value="standard">Standard</option>
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="shorter">Shorter</option>
        </select>
      </label>
      <button type="button" id="run" class="primary">Run</button>
      <span class="hint">Cmd/Ctrl + Enter</span>
    </div>

    <p id="status" class="status" role="status"></p>
    <p class="privacy">
      Grammar uses a local LanguageTool server. Paraphrase and summarize send text to Anthropic or OpenAI.
      Nothing else is collected.
    </p>

    <section class="issues" hidden>
      <h2>Grammar issues</h2>
      <ul id="issues"></ul>
    </section>

    <section class="diff-wrap">
      <h2>Diff</h2>
      <div id="diff" class="diff"></div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
